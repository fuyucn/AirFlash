name: Latency probe

# Builds the cross-language latency probes plus both GUI stacks (mygo/Go and
# WPF/C#) on a real Windows runner, then measures each one in the same way.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Also publish the binaries as a release'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Report toolchain
        shell: pwsh
        run: |
          go version
          rustc --version
          dotnet --version
          bun --version

      - name: Build the Go probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/probe | Out-Null
          Push-Location tools/latency-probe/go
          go build -trimpath -ldflags "-s -w" -o ../../../artifacts/probe/probe-go.exe .
          Pop-Location

      - name: Build the Rust probe
        shell: pwsh
        run: |
          Push-Location tools/latency-probe/rust
          cargo build --release
          Copy-Item target/release/probe-rust.exe ../../../artifacts/probe/probe-rust.exe
          Pop-Location

      - name: Publish the C# probe
        shell: pwsh
        run: |
          Push-Location tools/latency-probe/csharp
          dotnet publish -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -o ../../../artifacts/probe
          Pop-Location

      - name: Build the WPF app
        shell: pwsh
        run: |
          Push-Location tools/latency-probe/wpf
          dotnet publish -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -o ../../../artifacts/probe
          Pop-Location

      - name: Build the mygo app
        shell: pwsh
        run: |
          Push-Location tools/latency-probe/mygo
          bun install
          go mod download
          go run github.com/egoist/mygo/cmd/mygo@latest build -platform windows/amd64
          Pop-Location
          Copy-Item 'tools/latency-probe/mygo/build/windows-amd64/AirFlash Probe.exe' 'artifacts/probe/AirFlash Probe.exe'

      - name: Run the command line probes
        shell: pwsh
        run: |
          $cores = [Environment]::ProcessorCount
          $log = 'artifacts/probe/baseline-log.txt'
          "=== latency probe baseline (GitHub Windows runner) ===" | Out-File $log
          "time : $(Get-Date -Format o)"      | Out-File $log -Append
          "cores: $cores"                     | Out-File $log -Append
          "os   : $((Get-CimInstance Win32_OperatingSystem).Caption) $((Get-CimInstance Win32_OperatingSystem).Version)" | Out-File $log -Append
          "cpu  : $((Get-CimInstance Win32_Processor | Select-Object -First 1).Name)" | Out-File $log -Append
          "" | Out-File $log -Append
          foreach ($exe in 'probe-go.exe','probe-rust.exe','probe-csharp.exe') {
            "---------- $exe ----------" | Out-File $log -Append
            foreach ($case in @(
                @{ n = 'idle';     a = @('-slots','1500') },
                @{ n = 'idle+udp'; a = @('-slots','1500','-udp') },
                @{ n = 'burn';     a = @('-slots','1000','-burn',"$cores") },
                @{ n = 'burn+udp'; a = @('-slots','1000','-burn',"$cores",'-udp') }
            )) {
              "--- $($case.n) ---" | Out-File $log -Append
              & "artifacts/probe/$exe" @($case.a) 2>&1 | Tee-Object -FilePath $log -Append
            }
            "" | Out-File $log -Append
          }
          Get-Content $log

      # The GUI apps cannot be measured by the loop above: they own a window,
      # a message loop and a renderer. Each writes a JSON report instead, and
      # the whole process tree is sampled, because a webview (WebView2) and a
      # compositor run in their own processes.
      - name: Measure the GUI stacks
        shell: pwsh
        run: |
          $cores = [Environment]::ProcessorCount
          $log = 'artifacts/probe/baseline-log.txt'

          # The queue must be indexed, not re-sliced: in PowerShell 1..0 is the
          # descending range @(1, 0), so a slice-based pop on a one-element queue
          # re-adds the element forever.
          function Get-TreeRss($rootPid) {
            $all = Get-CimInstance Win32_Process | Select-Object ProcessId,ParentProcessId,Name,WorkingSetSize
            $sum = 0L
            $count = 0
            $rows = @()
            $todo = [System.Collections.Generic.Queue[int]]::new()
            $todo.Enqueue([int]$rootPid)
            $seen = @{}
            while ($todo.Count -gt 0) {
              $cur = $todo.Dequeue()
              if ($seen.ContainsKey($cur)) { continue }
              $seen[$cur] = $true
              foreach ($c in $all | Where-Object { $_.ParentProcessId -eq $cur }) {
                $sum += $c.WorkingSetSize
                $count++
                $rows += "    child $($c.Name) pid=$($c.ProcessId) ws=$([math]::Round($c.WorkingSetSize / 1MB, 1)) MB"
                $todo.Enqueue([int]$c.ProcessId)
              }
            }
            return [pscustomobject]@{ Sum = $sum; Count = $count; Rows = $rows }
          }

          function Measure-App($name, $exe, $report) {
            "---------- $name ----------" | Out-File $log -Append
            if (-not (Test-Path $exe)) {
              "MISSING $exe" | Out-File $log -Append
              return
            }
            $procArgs = @('-auto', $report, '-slots', '800', '-burn', "$cores")
            $p = Start-Process -FilePath $exe -ArgumentList $procArgs -PassThru -ErrorAction Stop
            Start-Sleep -Seconds 3
            $tree = Get-TreeRss $p.Id
            $root = (Get-CimInstance Win32_Process -Filter "ProcessId = $($p.Id)").WorkingSetSize
            "  root process : $([math]::Round($root / 1MB, 1)) MB" | Out-File $log -Append
            "  child procs  : $($tree.Count), $([math]::Round($tree.Sum / 1MB, 1)) MB" | Out-File $log -Append
            if ($tree.Rows.Count -gt 0) { $tree.Rows | Out-File $log -Append } else { "    (no child processes)" | Out-File $log -Append }
            "  TREE TOTAL   : $([math]::Round(($root + $tree.Sum) / 1MB, 1)) MB" | Out-File $log -Append

            # A webview's browser process can be parented elsewhere, so count
            # any msedgewebview2 processes separately.
            $edge = Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue
            if ($edge) {
              $edgeWs = ($edge | Measure-Object WorkingSet64 -Sum).Sum
              "  msedgewebview2: $($edge.Count) procs, $([math]::Round($edgeWs / 1MB, 1)) MB" | Out-File $log -Append
            } else {
              "  msedgewebview2: none" | Out-File $log -Append
            }

            if (-not $p.WaitForExit(180000)) {
              $p.Kill()
              "TIMEOUT after 180s" | Out-File $log -Append
              return
            }
            "exit code: $($p.ExitCode)" | Out-File $log -Append
            if (Test-Path $report) {
              Get-Content $report -Raw | Out-File $log -Append
            } else {
              "NO REPORT WRITTEN - the app could not open a window on this runner" | Out-File $log -Append
            }
            "" | Out-File $log -Append
          }

          Measure-App 'mygo (Go) GUI, burn=all cores' 'artifacts/probe/AirFlash Probe.exe' 'artifacts/probe/report-mygo.json'
          Measure-App 'WPF (C#) GUI, burn=all cores'   'artifacts/probe/WpfProbe.exe'       'artifacts/probe/report-wpf.json'
          "=== GUI section ===" | Out-File $log -Append
          Get-Content $log | Select-Object -Last 70

      - name: Hash the binaries
        shell: pwsh
        run: |
          Get-ChildItem artifacts/probe -File |
            Where-Object { $_.Name -notin @('SHA256SUMS.txt') } |
            ForEach-Object {
              $h = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$h  $($_.Name)"
            } | Set-Content -LiteralPath artifacts/probe/SHA256SUMS.txt -Encoding ascii
          Get-Content artifacts/probe/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: airflash-latency-probe-win-x64
          path: artifacts/probe/
          retention-days: 90

      - name: Publish a release with the binaries
        if: ${{ inputs.release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'latency-probe-v0.2.0'
          gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo ${{ github.repository }} `
              --title 'Latency probe 0.2.0' `
              --notes 'Cross-language latency probes and both GUI stacks (mygo/Go, WPF/C#), built and measured on a Windows runner. See baseline-log.txt.'
          }
          gh release upload $tag artifacts/probe/* --repo ${{ github.repository }} --clobber
